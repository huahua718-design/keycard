<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位透視眼 - 金黃光圈與防顛倒強化版</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
      // 終極防殘影綠幕 Shader (色度優勢演算法 + GPU 像素徹底剔除 discard)
      AFRAME.registerShader('chromakey', {
        schema: {
          src: { type: 'map' }
        },
        init: function (data) {
          const videoEl = typeof data.src === 'string' ? document.querySelector(data.src) : data.src;
          this.videoTexture = new THREE.VideoTexture(videoEl);
          this.videoTexture.minFilter = THREE.LinearFilter;
          this.videoTexture.magFilter = THREE.LinearFilter;
          
          this.material = new THREE.ShaderMaterial({
            uniforms: {
              uTexture: { value: this.videoTexture }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              precision mediump float;
              uniform sampler2D uTexture;
              varying vec2 vUv;

              void main() {
                vec4 texColor = texture2D(uTexture, vUv);

                float maxRB = max(texColor.r, texColor.b);
                float greenDominance = texColor.g - maxRB;

                // 徹底剔除綠幕，杜絕殘影
                if (greenDominance > 0.12 && texColor.g > 0.3) {
                  discard;
                }

                float alpha = 1.0;
                if (greenDominance > 0.04) {
                  alpha = 1.0 - smoothstep(0.04, 0.12, greenDominance);
                }

                gl_FragColor = vec4(texColor.rgb, alpha);
              }
            `,
            transparent: true,
            depthWrite: false
          });
        },
        update: function (data) {
          if (this.material && this.material.uniforms) {
            const videoEl = typeof data.src === 'string' ? document.querySelector(data.src) : data.src;
            if (this.videoTexture && this.videoTexture.image !== videoEl) {
              this.videoTexture.dispose();
              this.videoTexture = new THREE.VideoTexture(videoEl);
              this.videoTexture.minFilter = THREE.LinearFilter;
              this.videoTexture.magFilter = THREE.LinearFilter;
              this.material.uniforms.uTexture.value = this.videoTexture;
            }
          }
        }
      });

      // 持續方向自動鎖定組件：每影格校正撲克牌上下方向，杜絕對稱牌背 180 度翻轉
      AFRAME.registerComponent('auto-upright', {
        schema: {
          enabled: { type: 'boolean', default: false }
        },
        tick: function () {
          if (!this.data.enabled) return;

          const targetObj = this.el.sceneEl.querySelector('#x-target').object3D;
          if (!targetObj.visible) return;

          // 取得撲克牌局部 Y 軸在相機坐標系中的投影
          const cardUp = new THREE.Vector3(0, 1, 0).applyQuaternion(targetObj.quaternion);

          // 若卡片頂部朝下 (cardUp.y < 0)，補正 180 度；否則保持 0 度
          const isFlipped = cardUp.y < 0;
          const currentRotZ = isFlipped ? 180 : 0;

          const rigObj = this.el.object3D;
          rigObj.rotation.z = THREE.MathUtils.degToRad(currentRotZ);
        }
      });
    </script>

    <style>
        .mindar-ui-scanning, .mindar-ui-loading {
            display: none !important;
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.96);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #qrcode-container {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.35);
            display: inline-block;
        }

        .start-btn {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #2b1f00, #ffd700);
            color: #000;
            border: 1px solid #ffe600;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        .start-btn:hover {
            transform: scale(1.05);
        }
        
        #flash-bang {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            z-index: 9998;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="margin-bottom: 5px; letter-spacing: 2px; color: #ffd700;">數位透視眼</h2>
        <p style="margin-bottom: 25px; color: #aaa; font-size: 14px;">請用觀眾手機掃描，或由魔術師直接啟動</p>
        
        <div id="qrcode-container">
            <div id="qrcode"></div>
        </div>

        <button class="start-btn" onclick="startMagic()">啟動數位透視眼</button>
    </div>

    <div id="flash-bang"></div>

    <a-scene id="magic-scene" 
             mindar-image="imageTargetSrc: ./magic-cards.mind; maxTrack: 2; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF:0.001; filterBeta: 0.01;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets id="video-assets">
            <video id="vid-1" src="./stickman1.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-2" src="./stickman2.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 目標 0：鬼牌（感應條件） -->
        <a-entity id="joker-target" mindar-image-target="targetIndex: 0"></a-entity>

        <!-- 目標 1：牌堆（著陸與展示目標） -->
        <a-entity id="x-target" mindar-image-target="targetIndex: 1">
            
            <!-- 金黃色高質感科技鎖定光圈 (剛辨識時立刻擴張聚焦至牌背) -->
            <a-entity id="golden-circle-group" visible="false" position="0 0 0.02">
                <!-- 外層金環（旋轉 + 呼吸閃爍） -->
                <a-ring color="#FFD700" radius-inner="0.48" radius-outer="0.51" opacity="0.9"
                        material="shader: flat; transparent: true;"
                        animation="property: rotation; to: 0 0 360; loop: true; dur: 6000; easing: linear"
                        animation__pulse="property: opacity; from: 0.5; to: 1.0; dir: alternate; loop: true; dur: 800">
                </a-ring>

                <!-- 內層精準金色點線圈（逆時針快速旋轉） -->
                <a-ring color="#FFF099" radius-inner="0.36" radius-outer="0.38" opacity="0.8"
                        material="shader: flat; transparent: true;"
                        animation="property: rotation; to: 0 0 -360; loop: true; dur: 3500; easing: linear">
                </a-ring>

                <!-- 科技準星四角指引線 -->
                <a-entity position="0 0 0.005" animation="property: rotation; to: 0 0 360; loop: true; dur: 8000; easing: linear">
                    <a-plane color="#FFD700" width="0.75" height="0.015" position="0 0 0" material="shader: flat;"></a-plane>
                    <a-plane color="#FFD700" width="0.015" height="0.75" position="0 0 0" material="shader: flat;"></a-plane>
                </a-entity>

                <!-- 中心點金光 -->
                <a-circle color="#FFD700" radius="0.04" position="0 0 0.006" material="shader: flat;"></a-circle>
            </a-entity>

            <!-- 空間位移容器 (掛載自動方向校正組件) -->
            <a-entity id="character-rig" auto-upright="enabled: false">
                <a-plane id="stickman-plane"
                         material="shader: chromakey; src: #vid-1;"
                         position="0 0 0" 
                         width="1.1" 
                         height="1.1"
                         visible="false">
                </a-plane>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        let isVibrationAllowed = false;
        let jokerFound = false;
        let xCardFound = false;
        let hasTriggeredVisual = false;
        let androidVibrateInterval = null;

        const animationLibrary = [
            {
                id: 'vid-1', // X光機推車 (由左側走進來)
                startPos: { x: -1.3, y: 0.0, z: 0.1 },
                startScale: '0.85 0.85 0.85',
                dur: 4000
            },
            {
                id: 'vid-2', // 跳傘空降 (由上方降落至牌心)
                startPos: { x: 0.0, y: 1.4, z: 0.35 },
                startScale: '0.7 0.7 0.7',
                dur: 4500
            }
        ];

        let currentConfig = null;
        let lastPlayedIndex = -1;

        window.addEventListener('load', () => {
            const currentUrl = window.location.href;
            new QRCode(document.getElementById("qrcode"), {
                text: currentUrl,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });

        function getRandomConfig() {
            let nextIndex = Math.floor(Math.random() * animationLibrary.length);
            if (animationLibrary.length > 1) {
                while (nextIndex === lastPlayedIndex) {
                    nextIndex = Math.floor(Math.random() * animationLibrary.length);
                }
            }
            lastPlayedIndex = nextIndex;
            return animationLibrary[nextIndex];
        }

        async function startMagic() {
            isVibrationAllowed = true;
            if (navigator.vibrate) navigator.vibrate(50); 

            // 一次性喚醒全部影片
            animationLibrary.forEach(item => {
                const vid = document.getElementById(item.id);
                if (vid) {
                    vid.play().then(() => {
                        vid.pause();
                        vid.currentTime = 0;
                    }).catch(err => console.log("Video warm-up:", item.id, err));
                }
            });

            // Safari 相機授權預檢
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const tempStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                    tempStream.getTracks().forEach(track => track.stop());
                }
            } catch (err) {
                console.warn("Camera check:", err);
            }

            document.getElementById('overlay').style.display = 'none';

            const sceneEl = document.querySelector('a-scene');
            sceneEl.systems["mindar-image-system"].start(); 

            initMagicLogic();
        }

        function initMagicLogic() {
            const jokerTarget = document.getElementById('joker-target');
            const xTarget = document.getElementById('x-target');
            const goldenCircle = document.getElementById('golden-circle-group');
            const characterRig = document.getElementById('character-rig');
            const stickmanPlane = document.getElementById('stickman-plane');
            const flashBang = document.getElementById('flash-bang');

            jokerTarget.addEventListener("targetFound", () => { jokerFound = true; checkConditions(); });
            jokerTarget.addEventListener("targetLost", () => { jokerFound = false; checkConditions(); });
            xTarget.addEventListener("targetFound", () => { xCardFound = true; checkConditions(); });
            xTarget.addEventListener("targetLost", () => { xCardFound = false; checkConditions(); });

            function checkConditions() {
                if (jokerFound && xCardFound) {
                    if (!hasTriggeredVisual) {
                        hasTriggeredVisual = true;

                        // 1. 立即顯現「金黃色鎖定光圈」，框住牌背靶心
                        goldenCircle.setAttribute('visible', 'true');
                        goldenCircle.setAttribute('scale', '1.6 1.6 1.6');
                        goldenCircle.setAttribute('animation__shrink', {
                            property: 'scale',
                            to: '1 1 1',
                            dur: 1000,
                            easing: 'easeOutBack'
                        });

                        // 2. 隨機選取動畫配置
                        currentConfig = getRandomConfig();
                        const activeVideo = document.getElementById(currentConfig.id);

                        // 3. 啟動即時自動校正方向組件 (auto-upright)
                        characterRig.setAttribute('auto-upright', 'enabled', true);

                        // 依據卡片朝向計算起始空間位移
                        const targetObj = xTarget.object3D;
                        const cardUp = new THREE.Vector3(0, 1, 0).applyQuaternion(targetObj.quaternion);
                        const isFlipped = cardUp.y < 0;

                        const startX = isFlipped ? -currentConfig.startPos.x : currentConfig.startPos.x;
                        const startY = isFlipped ? -currentConfig.startPos.y : currentConfig.startPos.y;

                        characterRig.setAttribute('position', `${startX} ${startY} ${currentConfig.startPos.z}`);
                        characterRig.setAttribute('scale', currentConfig.startScale);

                        // 4. 平滑移動到牌心
                        characterRig.removeAttribute('animation__move');
                        characterRig.removeAttribute('animation__scale');
                        characterRig.setAttribute('animation__move', {
                            property: 'position',
                            to: '0 0 0.05',
                            dur: currentConfig.dur,
                            easing: 'easeOutQuad'
                        });
                        characterRig.setAttribute('animation__scale', {
                            property: 'scale',
                            to: '1 1 1',
                            dur: currentConfig.dur,
                            easing: 'easeOutQuad'
                        });

                        // 5. 播放選取的火柴人影片
                        stickmanPlane.setAttribute('material', 'src', '#' + currentConfig.id);
                        stickmanPlane.setAttribute('visible', 'true');
                        activeVideo.currentTime = 0;
                        activeVideo.play();

                        // 6. 閃白反饋
                        flashBang.style.transition = "none";
                        flashBang.style.opacity = "1";
                        setTimeout(() => {
                            flashBang.style.transition = "opacity 0.5s ease-out";
                            flashBang.style.opacity = "0";
                        }, 50);

                        // 7. 震動反饋
                        if (isVibrationAllowed && navigator.vibrate) {
                            androidVibrateInterval = setInterval(() => {
                                navigator.vibrate(200);
                            }, 500);
                        }
                    }
                } else {
                    if (!jokerFound || !xCardFound) {
                        stickmanPlane.setAttribute('visible', 'false');
                        goldenCircle.setAttribute('visible', 'false');
                        characterRig.setAttribute('auto-upright', 'enabled', false);

                        if (currentConfig) {
                            const activeVideo = document.getElementById(currentConfig.id);
                            if (activeVideo) activeVideo.pause();
                        }
                    }

                    if (!jokerFound && !xCardFound) {
                        hasTriggeredVisual = false;
                        if (androidVibrateInterval) {
                            clearInterval(androidVibrateInterval);
                            androidVibrateInterval = null;
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
