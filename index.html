<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位透視眼 - 隨機輪播動畫</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
      // 支援動態切換影片貼圖的綠幕 Shader
      AFRAME.registerShader('chromakey', {
        schema: {
          src: { type: 'map' },
          color: { type: 'color', default: '#00FF00' },
          similarity: { type: 'number', default: 0.4 },
          smoothness: { type: 'number', default: 0.1 }
        },
        init: function (data) {
          const videoEl = typeof data.src === 'string' ? document.querySelector(data.src) : data.src;
          this.videoTexture = new THREE.VideoTexture(videoEl);
          this.videoTexture.minFilter = THREE.LinearFilter;
          this.videoTexture.magFilter = THREE.LinearFilter;
          
          this.material = new THREE.ShaderMaterial({
            uniforms: {
              uTexture: { value: this.videoTexture },
              uKeyColor: { value: new THREE.Color(data.color) },
              uSimilarity: { value: data.similarity },
              uSmoothness: { value: data.smoothness }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D uTexture;
              uniform vec3 uKeyColor;
              uniform float uSimilarity;
              uniform float uSmoothness;
              varying vec2 vUv;

              void main() {
                vec4 videoColor = texture2D(uTexture, vUv);
                float dist = distance(videoColor.rgb, uKeyColor);
                float alpha = smoothstep(uSimilarity, uSimilarity + uSmoothness, dist);
                gl_FragColor = vec4(videoColor.rgb, videoColor.a * alpha);
              }
            `,
            transparent: true
          });
        },
        update: function (data) {
          if (this.material && this.material.uniforms) {
            const videoEl = typeof data.src === 'string' ? document.querySelector(data.src) : data.src;
            if (this.videoTexture && this.videoTexture.image !== videoEl) {
              this.videoTexture.dispose();
              this.videoTexture = new THREE.VideoTexture(videoEl);
              this.videoTexture.minFilter = THREE.LinearFilter;
              this.videoTexture.magFilter = THREE.LinearFilter;
              this.material.uniforms.uTexture.value = this.videoTexture;
            }
            this.material.uniforms.uKeyColor.value.set(data.color);
            this.material.uniforms.uSimilarity.value = data.similarity;
            this.material.uniforms.uSmoothness.value = data.smoothness;
          }
        }
      });
    </script>

    <style>
        .mindar-ui-scanning, .mindar-ui-loading {
            display: none !important;
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.96);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #qrcode-container {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.3);
            display: inline-block;
        }

        .start-btn {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #1f1c2c, #4facfe);
            color: white;
            border: 1px solid #00f2fe;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }
        .start-btn:hover {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            transform: scale(1.05);
        }
        
        #flash-bang {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            z-index: 9998;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="margin-bottom: 5px; letter-spacing: 2px; color: #00f2fe;">數位透視眼</h2>
        <p style="margin-bottom: 25px; color: #888; font-size: 14px;">請用觀眾手機掃描，或由魔術師直接啟動</p>
        
        <div id="qrcode-container">
            <div id="qrcode"></div>
        </div>

        <button class="start-btn" onclick="startMagic()">啟動數位透視眼</button>
    </div>

    <div id="flash-bang"></div>

    <a-scene id="magic-scene" 
             mindar-image="imageTargetSrc: ./magic-cards.mind; maxTrack: 2; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF:0.001; filterBeta: 0.01;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets id="video-assets">
            <!-- 在此處列出根目錄下的所有動畫影片 -->
            <video id="vid-1" src="./stickman1.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-2" src="./stickman2.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-3" src="./stickman3.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 目標 0：鬼牌（純感應條件） -->
        <a-entity id="joker-target" mindar-image-target="targetIndex: 0"></a-entity>

        <!-- 目標 1：牌堆（隨機火柴人播放位置） -->
        <a-entity id="x-target" mindar-image-target="targetIndex: 1">
            <a-plane id="stickman-plane"
                     material="shader: chromakey; src: #vid-1; color: #00FF00; similarity: 0.4; smoothness: 0.1;"
                     position="0 0 0.05" 
                     rotation="0 0 0"
                     width="1.0" 
                     height="1.0"
                     visible="false">
            </a-plane>
        </a-entity>
    </a-scene>

    <script>
        let isVibrationAllowed = false;
        let jokerFound = false;
        let xCardFound = false;
        let hasTriggeredVisual = false;
        let androidVibrateInterval = null;

        // 動畫影片 ID 清單
        const videoIdList = ['vid-1', 'vid-2', 'vid-3'];
        let currentActiveVideo = null;
        let lastPlayedIndex = -1;

        window.addEventListener('load', () => {
            const currentUrl = window.location.href;
            new QRCode(document.getElementById("qrcode"), {
                text: currentUrl,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });

        // 隨機選取不與上次重複的影片
        function getRandomVideo() {
            let nextIndex = Math.floor(Math.random() * videoIdList.length);
            if (videoIdList.length > 1) {
                while (nextIndex === lastPlayedIndex) {
                    nextIndex = Math.floor(Math.random() * videoIdList.length);
                }
            }
            lastPlayedIndex = nextIndex;
            return document.getElementById(videoIdList[nextIndex]);
        }

        async function startMagic() {
            isVibrationAllowed = true;
            if (navigator.vibrate) navigator.vibrate(50); 

            // 一次性喚醒所有輪播影片，突破 iOS 自動播放封鎖
            videoIdList.forEach(id => {
                const vid = document.getElementById(id);
                if (vid) {
                    vid.play().then(() => {
                        vid.pause();
                        vid.currentTime = 0;
                    }).catch(err => console.log("Video warm-up error:", id, err));
                }
            });

            // iOS Safari 鏡頭預檢
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const tempStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                    tempStream.getTracks().forEach(track => track.stop());
                }
            } catch (err) {
                console.warn("Camera check:", err);
            }

            document.getElementById('overlay').style.display = 'none';

            const sceneEl = document.querySelector('a-scene');
            const arSystem = sceneEl.systems["mindar-image-system"];
            arSystem.start(); 

            initMagicLogic();
        }

        function initMagicLogic() {
            const jokerTarget = document.getElementById('joker-target');
            const xTarget = document.getElementById('x-target');
            const flashBang = document.getElementById('flash-bang');
            const stickmanPlane = document.getElementById('stickman-plane');

            jokerTarget.addEventListener("targetFound", () => { jokerFound = true; checkConditions(); });
            jokerTarget.addEventListener("targetLost", () => { jokerFound = false; checkConditions(); });
            xTarget.addEventListener("targetFound", () => { xCardFound = true; checkConditions(); });
            xTarget.addEventListener("targetLost", () => { xCardFound = false; checkConditions(); });

            function checkConditions() {
                if (jokerFound && xCardFound) {
                    if (!hasTriggeredVisual) {
                        hasTriggeredVisual = true;
                        
                        // 1. 隨機選取影片並動態換上貼圖
                        currentActiveVideo = getRandomVideo();
                        stickmanPlane.setAttribute('material', 'src', '#' + currentActiveVideo.id);

                        // 2. 顯示並播放選中的影片
                        stickmanPlane.setAttribute('visible', 'true');
                        currentActiveVideo.currentTime = 0;
                        currentActiveVideo.play();

                        // 3. 瞬間閃白
                        flashBang.style.transition = "none";
                        flashBang.style.opacity = "1";
                        setTimeout(() => {
                            flashBang.style.transition = "opacity 0.5s ease-out";
                            flashBang.style.opacity = "0";
                        }, 50);

                        // 4. 震動
                        if (isVibrationAllowed && navigator.vibrate) {
                            androidVibrateInterval = setInterval(() => {
                                navigator.vibrate(200);
                            }, 500);
                        }
                    }
                } else {
                    if (!jokerFound || !xCardFound) {
                        stickmanPlane.setAttribute('visible', 'false');
                        if (currentActiveVideo) {
                            currentActiveVideo.pause();
                        }
                    }

                    if (!jokerFound && !xCardFound) {
                        hasTriggeredVisual = false;
                        if (androidVibrateInterval) {
                            clearInterval(androidVibrateInterval);
                            androidVibrateInterval = null;
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
