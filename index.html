<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數位透視眼 - 空間位移與方向鎖定</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
      // 終極防殘影綠幕 Shader (色度優勢演算法 + GPU 像素徹底剔除 discard)
      AFRAME.registerShader('chromakey', {
        schema: {
          src: { type: 'map' }
        },
        init: function (data) {
          const videoEl = typeof data.src === 'string' ? document.querySelector(data.src) : data.src;
          this.videoTexture = new THREE.VideoTexture(videoEl);
          this.videoTexture.minFilter = THREE.LinearFilter;
          this.videoTexture.magFilter = THREE.LinearFilter;
          
          this.material = new THREE.ShaderMaterial({
            uniforms: {
              uTexture: { value: this.videoTexture }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              precision mediump float;
              uniform sampler2D uTexture;
              varying vec2 vUv;

              void main() {
                vec4 texColor = texture2D(uTexture, vUv);

                // 計算綠色相對於紅藍的優勢
                float maxRB = max(texColor.r, texColor.b);
                float greenDominance = texColor.g - maxRB;

                // 綠幕直接丟棄，零綠色殘影
                if (greenDominance > 0.12 && texColor.g > 0.3) {
                  discard;
                }

                // 邊緣羽化
                float alpha = 1.0;
                if (greenDominance > 0.04) {
                  alpha = 1.0 - smoothstep(0.04, 0.12, greenDominance);
                }

                gl_FragColor = vec4(texColor.rgb, alpha);
              }
            `,
            transparent: true,
            depthWrite: false
          });
        },
        update: function (data) {
          if (this.material && this.material.uniforms) {
            const videoEl = typeof data.src === 'string' ? document.querySelector(data.src) : data.src;
            if (this.videoTexture && this.videoTexture.image !== videoEl) {
              this.videoTexture.dispose();
              this.videoTexture = new THREE.VideoTexture(videoEl);
              this.videoTexture.minFilter = THREE.LinearFilter;
              this.videoTexture.magFilter = THREE.LinearFilter;
              this.material.uniforms.uTexture.value = this.videoTexture;
            }
          }
        }
      });
    </script>

    <style>
        .mindar-ui-scanning, .mindar-ui-loading {
            display: none !important;
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.96);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #qrcode-container {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.3);
            display: inline-block;
        }

        .start-btn {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #1f1c2c, #4facfe);
            color: white;
            border: 1px solid #00f2fe;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }
        .start-btn:hover {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            transform: scale(1.05);
        }
        
        #flash-bang {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            z-index: 9998;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="margin-bottom: 5px; letter-spacing: 2px; color: #00f2fe;">數位透視眼</h2>
        <p style="margin-bottom: 25px; color: #888; font-size: 14px;">請用觀眾手機掃描，或由魔術師直接啟動</p>
        
        <div id="qrcode-container">
            <div id="qrcode"></div>
        </div>

        <button class="start-btn" onclick="startMagic()">啟動數位透視眼</button>
    </div>

    <div id="flash-bang"></div>

    <a-scene id="magic-scene" 
             mindar-image="imageTargetSrc: ./magic-cards.mind; maxTrack: 2; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF:0.001; filterBeta: 0.01;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets id="video-assets">
            <!-- 動畫清單：vid-1 為 X 光機（走路），vid-2 為跳傘（空降） -->
            <video id="vid-1" src="./stickman1.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-2" src="./stickman2.mp4" preload="auto" loop="true" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 目標 0：鬼牌（純感應條件） -->
        <a-entity id="joker-target" mindar-image-target="targetIndex: 0"></a-entity>

        <!-- 目標 1：牌堆 -->
        <a-entity id="x-target" mindar-image-target="targetIndex: 1">
            <!-- 
                空間位移容器 (Rig)：
                由 A-Frame 動畫引擎控制從牌外平滑移動到牌心
            -->
            <a-entity id="character-rig">
                <a-plane id="stickman-plane"
                         material="shader: chromakey; src: #vid-1;"
                         position="0 0 0" 
                         width="1.1" 
                         height="1.1"
                         visible="false">
                </a-plane>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        let isVibrationAllowed = false;
        let jokerFound = false;
        let xCardFound = false;
        let hasTriggeredVisual = false;
        let androidVibrateInterval = null;

        // 動畫設定庫：為不同動畫定義入場起點與時間
        const animationLibrary = [
            {
                id: 'vid-1', // X光機推車 (從左側視野走進來)
                startPos: { x: -1.3, y: 0.0, z: 0.1 },
                startScale: '0.85 0.85 0.85',
                dur: 4000
            },
            {
                id: 'vid-2', // 跳傘空降 (從上方空降落到牌面)
                startPos: { x: 0.0, y: 1.4, z: 0.35 },
                startScale: '0.7 0.7 0.7',
                dur: 4500
            }
        ];

        let currentConfig = null;
        let lastPlayedIndex = -1;

        window.addEventListener('load', () => {
            const currentUrl = window.location.href;
            new QRCode(document.getElementById("qrcode"), {
                text: currentUrl,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });

        function getRandomConfig() {
            let nextIndex = Math.floor(Math.random() * animationLibrary.length);
            if (animationLibrary.length > 1) {
                while (nextIndex === lastPlayedIndex) {
                    nextIndex = Math.floor(Math.random() * animationLibrary.length);
                }
            }
            lastPlayedIndex = nextIndex;
            return animationLibrary[nextIndex];
        }

        // 方向自動校正：確保火柴人永遠朝向手機上方
        function enforceScreenUpright(targetEntity, rigEntity, baseStartPos) {
            const targetObj = targetEntity.object3D;
            // 取得卡片在鏡頭坐標系下的 Local Up 向量
            const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(targetObj.quaternion);

            // 若卡片頂部指向手機下方 (localUp.y < 0)，表示辨識相反，需要旋轉 180 度補正
            const isFlipped = localUp.y < 0;
            rigEntity.setAttribute('rotation', isFlipped ? '0 0 180' : '0 0 0');

            // 確保入場的起點相對於手機螢幕的一致性
            if (isFlipped) {
                return {
                    x: -baseStartPos.x,
                    y: -baseStartPos.y,
                    z: baseStartPos.z
                };
            }
            return baseStartPos;
        }

        async function startMagic() {
            isVibrationAllowed = true;
            if (navigator.vibrate) navigator.vibrate(50); 

            // 一次性解鎖影片
            animationLibrary.forEach(item => {
                const vid = document.getElementById(item.id);
                if (vid) {
                    vid.play().then(() => {
                        vid.pause();
                        vid.currentTime = 0;
                    }).catch(err => console.log("Video warm-up error:", item.id, err));
                }
            });

            // iOS Safari 鏡頭預檢
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const tempStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" }
                    });
                    tempStream.getTracks().forEach(track => track.stop());
                }
            } catch (err) {
                console.warn("Camera check:", err);
            }

            document.getElementById('overlay').style.display = 'none';

            const sceneEl = document.querySelector('a-scene');
            const arSystem = sceneEl.systems["mindar-image-system"];
            arSystem.start(); 

            initMagicLogic();
        }

        function initMagicLogic() {
            const jokerTarget = document.getElementById('joker-target');
            const xTarget = document.getElementById('x-target');
            const characterRig = document.getElementById('character-rig');
            const stickmanPlane = document.getElementById('stickman-plane');
            const flashBang = document.getElementById('flash-bang');

            jokerTarget.addEventListener("targetFound", () => { jokerFound = true; checkConditions(); });
            jokerTarget.addEventListener("targetLost", () => { jokerFound = false; checkConditions(); });
            xTarget.addEventListener("targetFound", () => { xCardFound = true; checkConditions(); });
            xTarget.addEventListener("targetLost", () => { xCardFound = false; checkConditions(); });

            function checkConditions() {
                if (jokerFound && xCardFound) {
                    if (!hasTriggeredVisual) {
                        hasTriggeredVisual = true;

                        // 1. 隨機選取動畫配置
                        currentConfig = getRandomConfig();
                        const activeVideo = document.getElementById(currentConfig.id);

                        // 2. 自動判斷撲克牌是否顛倒，並計算旋轉補正與動態起點
                        const adjustedPos = enforceScreenUpright(xTarget, characterRig, currentConfig.startPos);

                        // 3. 設定初始位置與比例
                        characterRig.setAttribute('position', `${adjustedPos.x} ${adjustedPos.y} ${adjustedPos.z}`);
                        characterRig.setAttribute('scale', currentConfig.startScale);

                        // 4. 動態綁定 A-Frame 移動動畫（平滑抵達牌心 0 0 0.05）
                        characterRig.removeAttribute('animation__move');
                        characterRig.removeAttribute('animation__scale');

                        characterRig.setAttribute('animation__move', {
                            property: 'position',
                            to: '0 0 0.05',
                            dur: currentConfig.dur,
                            easing: 'easeOutQuad'
                        });
                        characterRig.setAttribute('animation__scale', {
                            property: 'scale',
                            to: '1 1 1',
                            dur: currentConfig.dur,
                            easing: 'easeOutQuad'
                        });

                        // 5. 切換材質並開始播放影片
                        stickmanPlane.setAttribute('material', 'src', '#' + currentConfig.id);
                        stickmanPlane.setAttribute('visible', 'true');
                        activeVideo.currentTime = 0;
                        activeVideo.play();

                        // 6. 閃白反饋
                        flashBang.style.transition = "none";
                        flashBang.style.opacity = "1";
                        setTimeout(() => {
                            flashBang.style.transition = "opacity 0.5s ease-out";
                            flashBang.style.opacity = "0";
                        }, 50);

                        // 7. 震動反饋
                        if (isVibrationAllowed && navigator.vibrate) {
                            androidVibrateInterval = setInterval(() => {
                                navigator.vibrate(200);
                            }, 500);
                        }
                    }
                } else {
                    if (!jokerFound || !xCardFound) {
                        stickmanPlane.setAttribute('visible', 'false');
                        if (currentConfig) {
                            const activeVideo = document.getElementById(currentConfig.id);
                            if (activeVideo) activeVideo.pause();
                        }
                    }

                    if (!jokerFound && !xCardFound) {
                        hasTriggeredVisual = false;
                        if (androidVibrateInterval) {
                            clearInterval(androidVibrateInterval);
                            androidVibrateInterval = null;
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
