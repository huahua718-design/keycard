<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數位透視眼 - 自動留影版</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
      // 終極防殘影綠幕 Shader (色度優勢演算法 + GPU 像素徹底剔除 discard)
      AFRAME.registerShader('chromakey', {
        schema: {
          src: { type: 'map' }
        },
        init: function (data) {
          const videoEl = typeof data.src === 'string' ? document.querySelector(data.src) : data.src;
          this.videoTexture = new THREE.VideoTexture(videoEl);
          this.videoTexture.minFilter = THREE.LinearFilter;
          this.videoTexture.magFilter = THREE.LinearFilter;
          
          this.material = new THREE.ShaderMaterial({
            uniforms: {
              uTexture: { value: this.videoTexture }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              precision mediump float;
              uniform sampler2D uTexture;
              varying vec2 vUv;

              void main() {
                vec4 texColor = texture2D(uTexture, vUv);

                float maxRB = max(texColor.r, texColor.b);
                float greenDominance = texColor.g - maxRB;

                // 徹底剔除綠幕，杜絕殘影
                if (greenDominance > 0.12 && texColor.g > 0.3) {
                  discard;
                }

                // 邊緣羽化
                float alpha = 1.0;
                if (greenDominance > 0.04) {
                  alpha = 1.0 - smoothstep(0.04, 0.12, greenDominance);
                }

                gl_FragColor = vec4(texColor.rgb, alpha);
              }
            `,
            transparent: true,
            depthWrite: false
          });
        },
        update: function (data) {
          if (this.material && this.material.uniforms) {
            const videoEl = typeof data.src === 'string' ? document.querySelector(data.src) : data.src;
            if (this.videoTexture && this.videoTexture.image !== videoEl) {
              this.videoTexture.dispose();
              this.videoTexture = new THREE.VideoTexture(videoEl);
              this.videoTexture.minFilter = THREE.LinearFilter;
              this.videoTexture.magFilter = THREE.LinearFilter;
              this.material.uniforms.uTexture.value = this.videoTexture;
            }
          }
        }
      });

      // 每影格自動校正撲克牌上下方向，杜絕 180 度翻轉
      AFRAME.registerComponent('auto-upright', {
        schema: {
          enabled: { type: 'boolean', default: false }
        },
        tick: function () {
          if (!this.data.enabled) return;

          const targetObj = this.el.sceneEl.querySelector('#x-target').object3D;
          if (!targetObj.visible) return;

          const cardUp = new THREE.Vector3(0, 1, 0).applyQuaternion(targetObj.quaternion);
          const isFlipped = cardUp.y < 0;
          const currentRotZ = isFlipped ? 180 : 0;

          const rigObj = this.el.object3D;
          rigObj.rotation.z = THREE.MathUtils.degToRad(currentRotZ);
        }
      });
    </script>

    <style>
        .mindar-ui-scanning, .mindar-ui-loading {
            display: none !important;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden;
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.96);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #qrcode-container {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
            display: inline-block;
        }

        .start-btn {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #1f1c2c, #4facfe);
            color: white;
            border: 1px solid #00f2fe;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }
        .start-btn:hover {
            transform: scale(1.05);
        }
        
        #flash-bang {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            z-index: 9998;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
        }

        /* 拍攝完成彈出照片視窗 */
        #photo-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 10000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }

        #captured-image {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 12px;
            border: 2px solid #00f2fe;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
            margin-bottom: 15px;
        }

        .photo-tip {
            color: #ddd;
            font-size: 14px;
            margin-bottom: 15px;
            font-family: sans-serif;
            letter-spacing: 1px;
        }

        .retry-btn {
            padding: 10px 28px;
            font-size: 15px;
            background: #222;
            color: #00f2fe;
            border: 1px solid #00f2fe;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="margin-bottom: 5px; letter-spacing: 2px; color: #00f2fe;">數位透視眼</h2>
        <p style="margin-bottom: 25px; color: #888; font-size: 14px;">請用觀眾手機掃描，或由魔術師直接啟動</p>
        <div id="qrcode-container">
            <div id="qrcode"></div>
        </div>
        <button class="start-btn" onclick="startMagic()">啟動數位透視眼</button>
    </div>

    <div id="flash-bang"></div>

    <!-- 拍攝完成彈出視窗 -->
    <div id="photo-modal">
        <h3 style="color: #00f2fe; margin-top: 0; letter-spacing: 2px;">透視預言已記錄</h3>
        <img id="captured-image" alt="透視預言照片">
        <div class="photo-tip">長按上方照片即可儲存至相簿</div>
        <button class="retry-btn" onclick="closePhotoModal()">再次體驗</button>
    </div>

    <!-- 隱藏拍照合成畫布 -->
    <canvas id="photo-canvas" style="display: none;"></canvas>

    <a-scene id="magic-scene" 
             mindar-image="imageTargetSrc: ./magic-cards.mind; maxTrack: 2; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF:0.001; filterBeta: 0.01;" 
             color-space="sRGB" 
             renderer="colorManagement: true; preserveDrawingBuffer: true;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets id="video-assets">
            <video id="vid-1" src="./stickman1.mp4" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
            <video id="vid-2" src="./stickman2.mp4" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 目標 0：鬼牌（感應條件） -->
        <a-entity id="joker-target" mindar-image-target="targetIndex: 0"></a-entity>

        <!-- 目標 1：牌堆（著陸目標） -->
        <a-entity id="x-target" mindar-image-target="targetIndex: 1">
            <a-entity id="character-rig" auto-upright="enabled: false">
                <a-plane id="stickman-plane"
                         material="shader: chromakey; src: #vid-1;"
                         position="0 0 0" 
                         width="1.1" 
                         height="1.1"
                         visible="false">
                </a-plane>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        let isVibrationAllowed = false;
        let jokerFound = false;
        let xCardFound = false;
        let hasTriggeredVisual = false;
        let androidVibrateInterval = null;
        let hasCaptured = false;

        const animationLibrary = [
            {
                id: 'vid-1', // X光機推車 (由左側走進來)
                startPos: { x: -1.3, y: 0.0, z: 0.1 },
                startScale: '0.85 0.85 0.85',
                dur: 4000
            },
            {
                id: 'vid-2', // 跳傘空降 (由上方降落至牌心)
                startPos: { x: 0.0, y: 1.4, z: 0.35 },
                startScale: '0.7 0.7 0.7',
                dur: 4500
            }
        ];

        let currentConfig = null;
        let lastPlayedIndex = -1;

        window.addEventListener('load', () => {
            const currentUrl = window.location.href;
            new QRCode(document.getElementById("qrcode"), {
                text: currentUrl,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });

        function getRandomConfig() {
            let nextIndex = Math.floor(Math.random() * animationLibrary.length);
            if (animationLibrary.length > 1) {
                while (nextIndex === lastPlayedIndex) {
                    nextIndex = Math.floor(Math.random() * animationLibrary.length);
                }
            }
            lastPlayedIndex = nextIndex;
            return animationLibrary[nextIndex];
        }

        // 核心合成快照：主動強制渲染 WebGL，雙層繪製保留火柴人
        function captureMagicSnapshot() {
            if (hasCaptured) return;
            hasCaptured = true;

            const sceneEl = document.querySelector('a-scene');
            // 尋找 MindAR 建立的鏡頭 video
            const arVideo = document.querySelector('video:not([id^="vid-"])');
            const webglCanvas = sceneEl.canvas;
            const photoCanvas = document.getElementById('photo-canvas');
            const ctx = photoCanvas.getContext('2d');

            if (!arVideo || !webglCanvas) return;

            // 確保擷取時強制渲染當前影格至 buffer，避免被清空
            if (sceneEl.renderer && sceneEl.object3D && sceneEl.camera) {
                sceneEl.renderer.render(sceneEl.object3D, sceneEl.camera);
            }

            photoCanvas.width = webglCanvas.width;
            photoCanvas.height = webglCanvas.height;

            // 1. 繪製底層真實相機背景
            ctx.drawImage(arVideo, 0, 0, photoCanvas.width, photoCanvas.height);

            // 2. 疊合 WebGL AR 內容（火柴人定格影像）
            ctx.drawImage(webglCanvas, 0, 0, photoCanvas.width, photoCanvas.height);

            // 3. 輸出照片並彈出展示
            const dataUrl = photoCanvas.toDataURL('image/jpeg', 0.95);
            document.getElementById('captured-image').src = dataUrl;
            document.getElementById('photo-modal').style.display = 'flex';

            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        function closePhotoModal() {
            document.getElementById('photo-modal').style.display = 'none';
            hasCaptured = false;
            hasTriggeredVisual = false;
        }

        function startMagic() {
            document.getElementById('overlay').style.display = 'none';
            isVibrationAllowed = true;
            if (navigator.vibrate) navigator.vibrate(50); 

            // 一次性喚醒所有動畫
            animationLibrary.forEach(item => {
                const vid = document.getElementById(item.id);
                if (vid) {
                    vid.play().then(() => {
                        vid.pause();
                        vid.currentTime = 0;
                    }).catch(err => console.log("Warm-up:", item.id, err));
                }
            });

            // 交由 MindAR 官方原生管線開啟相機（不干擾 iOS Safari 硬體指派）
            const sceneEl = document.querySelector('a-scene');
            const arSystem = sceneEl.systems["mindar-image-system"];
            arSystem.start(); 

            initMagicLogic();
        }

        function initMagicLogic() {
            const jokerTarget = document.getElementById('joker-target');
            const xTarget = document.getElementById('x-target');
            const characterRig = document.getElementById('character-rig');
            const stickmanPlane = document.getElementById('stickman-plane');
            const flashBang = document.getElementById('flash-bang');

            jokerTarget.addEventListener("targetFound", () => { jokerFound = true; checkConditions(); });
            jokerTarget.addEventListener("targetLost", () => { jokerFound = false; checkConditions(); });
            xTarget.addEventListener("targetFound", () => { xCardFound = true; checkConditions(); });
            xTarget.addEventListener("targetLost", () => { xCardFound = false; checkConditions(); });

            function checkConditions() {
                if (jokerFound && xCardFound) {
                    if (!hasTriggeredVisual && !hasCaptured) {
                        hasTriggeredVisual = true;

                        // 1. 隨機選取動畫配置
                        currentConfig = getRandomConfig();
                        const activeVideo = document.getElementById(currentConfig.id);

                        // 2. 監聽影片即將結束：在倒數 0.15 秒主動 pause() 定格在最後一幀，隨後拍照
                        activeVideo.ontimeupdate = () => {
                            if (activeVideo.duration && activeVideo.currentTime >= activeVideo.duration - 0.15) {
                                activeVideo.ontimeupdate = null; // 解除監聽
                                activeVideo.pause(); // 鎖死定格在最後動作
                                setTimeout(() => {
                                    captureMagicSnapshot();
                                }, 150);
                            }
                        };

                        // 3. 啟動方向即時校正 (auto-upright)
                        characterRig.setAttribute('auto-upright', 'enabled', true);

                        const targetObj = xTarget.object3D;
                        const cardUp = new THREE.Vector3(0, 1, 0).applyQuaternion(targetObj.quaternion);
                        const isFlipped = cardUp.y < 0;

                        const startX = isFlipped ? -currentConfig.startPos.x : currentConfig.startPos.x;
                        const startY = isFlipped ? -currentConfig.startPos.y : currentConfig.startPos.y;

                        characterRig.setAttribute('position', `${startX} ${startY} ${currentConfig.startPos.z}`);
                        characterRig.setAttribute('scale', currentConfig.startScale);

                        // 4. 平滑移動至牌心
                        characterRig.removeAttribute('animation__move');
                        characterRig.removeAttribute('animation__scale');
                        characterRig.setAttribute('animation__move', {
                            property: 'position',
                            to: '0 0 0.05',
                            dur: currentConfig.dur,
                            easing: 'easeOutQuad'
                        });
                        characterRig.setAttribute('animation__scale', {
                            property: 'scale',
                            to: '1 1 1',
                            dur: currentConfig.dur,
                            easing: 'easeOutQuad'
                        });

                        // 5. 顯示並播放選中的火柴人影片
                        stickmanPlane.setAttribute('material', 'src', '#' + currentConfig.id);
                        stickmanPlane.setAttribute('visible', 'true');
                        activeVideo.currentTime = 0;
                        activeVideo.play();

                        // 6. 閃白反饋
                        flashBang.style.transition = "none";
                        flashBang.style.opacity = "1";
                        setTimeout(() => {
                            flashBang.style.transition = "opacity 0.5s ease-out";
                            flashBang.style.opacity = "0";
                        }, 50);

                        // 7. 震動反饋
                        if (isVibrationAllowed && navigator.vibrate) {
                            androidVibrateInterval = setInterval(() => {
                                navigator.vibrate(200);
                            }, 500);
                        }
                    }
                } else {
                    if (!jokerFound || !xCardFound) {
                        if (!hasCaptured) {
                            stickmanPlane.setAttribute('visible', 'false');
                            characterRig.setAttribute('auto-upright', 'enabled', false);

                            if (currentConfig) {
                                const activeVideo = document.getElementById(currentConfig.id);
                                if (activeVideo) activeVideo.pause();
                            }
                        }
                    }

                    if (!jokerFound && !xCardFound) {
                        if (!hasCaptured) {
                            hasTriggeredVisual = false;
                        }
                        if (androidVibrateInterval) {
                            clearInterval(androidVibrateInterval);
                            androidVibrateInterval = null;
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
