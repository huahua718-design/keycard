<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數位透視眼</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
      // 專為 iOS / Android 設計的穩定版綠幕 Shader (避免 WebGL 編譯中斷)
      AFRAME.registerShader('chromakey', {
        schema: {
          src: { type: 'map' },
          color: { type: 'color', default: '#00FF00' },
          similarity: { type: 'number', default: 0.65 },
          smoothness: { type: 'number', default: 0.1 }
        },
        init: function (data) {
          const videoEl = typeof data.src === 'string' ? document.querySelector(data.src) : data.src;
          const videoTexture = new THREE.VideoTexture(videoEl);
          videoTexture.minFilter = THREE.LinearFilter;
          videoTexture.magFilter = THREE.LinearFilter;

          this.material = new THREE.ShaderMaterial({
            uniforms: {
              uTexture: { value: videoTexture },
              uKeyColor: { value: new THREE.Color(data.color) },
              uSimilarity: { value: data.similarity },
              uSmoothness: { value: data.smoothness }
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              precision mediump float;
              uniform sampler2D uTexture;
              uniform vec3 uKeyColor;
              uniform float uSimilarity;
              uniform float uSmoothness;
              varying vec2 vUv;

              void main() {
                vec4 texColor = texture2D(uTexture, vUv);
                
                // 綠色權重判定：捕捉發光綠與淡綠色
                float greenDiff = texColor.g - max(texColor.r, texColor.b);
                float dist = distance(texColor.rgb, uKeyColor);
                
                float alpha = smoothstep(uSimilarity - uSmoothness, uSimilarity, dist);
                if (greenDiff > 0.15) {
                  alpha = min(alpha, 1.0 - smoothstep(0.15, 0.35, greenDiff));
                }

                gl_FragColor = vec4(texColor.rgb, texColor.a * alpha);
              }
            `,
            transparent: true
          });
        },
        update: function (data) {
          if (this.material && this.material.uniforms) {
            this.material.uniforms.uKeyColor.value.set(data.color);
            this.material.uniforms.uSimilarity.value = data.similarity;
            this.material.uniforms.uSmoothness.value = data.smoothness;
          }
        }
      });
    </script>

    <style>
        .mindar-ui-scanning, .mindar-ui-loading {
            display: none !important;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* 底色改為黑色，避免任何白色漏光假象 */
        }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.96);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #qrcode-container {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.3);
            display: inline-block;
        }

        .start-btn {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(45deg, #1f1c2c, #4facfe);
            color: white;
            border: 1px solid #00f2fe;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }

        /* 預設 display: none，杜絕白畫面遮罩誤觸 */
        #flash-bang {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            opacity: 0;
            display: none;
            z-index: 9998;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="margin-bottom: 5px; letter-spacing: 2px; color: #00f2fe;">數位透視眼</h2>
        <p style="margin-bottom: 25px; color: #888; font-size: 14px;">請用手機掃描開啟相機進行透視</p>
        <div id="qrcode-container">
            <div id="qrcode"></div>
        </div>
        <button class="start-btn" onclick="startMagic()">啟動數位透視眼</button>
    </div>

    <div id="flash-bang"></div>

    <a-scene id="magic-scene" 
             mindar-image="imageTargetSrc: ./magic-cards.mind; maxTrack: 2; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF:0.001; filterBeta: 0.01;" 
             color-space="sRGB" 
             renderer="colorManagement: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <video id="stickman-video" 
                   src="./stickman.mp4" 
                   preload="auto" 
                   loop="true" 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline 
                   muted>
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 目標 0：鬼牌（觸發感應） -->
        <a-entity id="joker-target" mindar-image-target="targetIndex: 0"></a-entity>

        <!-- 目標 1：牌堆（火柴人登場處） -->
        <a-entity id="x-target" mindar-image-target="targetIndex: 1">
            <a-plane id="stickman-plane"
                     material="shader: chromakey; src: #stickman-video; color: #00FF00; similarity: 0.65; smoothness: 0.1;"
                     position="0 0 0.05" 
                     rotation="0 0 0"
                     width="1.0" 
                     height="1.0"
                     visible="false">
            </a-plane>
        </a-entity>
    </a-scene>

    <script>
        let isVibrationAllowed = false;
        let jokerFound = false;
        let xCardFound = false;
        let hasTriggeredVisual = false;
        let androidVibrateInterval = null;

        window.addEventListener('load', () => {
            const currentUrl = window.location.href;
            new QRCode(document.getElementById("qrcode"), {
                text: currentUrl,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        });

        function triggerFlash() {
            const flashBang = document.getElementById('flash-bang');
            flashBang.style.display = "block";
            flashBang.style.opacity = "1";
            setTimeout(() => {
                flashBang.style.opacity = "0";
                setTimeout(() => {
                    flashBang.style.display = "none";
                }, 300);
            }, 50);
        }

        function startMagic() {
            document.getElementById('overlay').style.display = 'none';
            isVibrationAllowed = true;
            if (navigator.vibrate) navigator.vibrate(50); 
            
            const stickmanVideo = document.getElementById('stickman-video');
            stickmanVideo.play().then(() => {
                stickmanVideo.pause();
                stickmanVideo.currentTime = 0;
            }).catch(e => console.log("Video auto-play unlock handled:", e));

            const sceneEl = document.querySelector('a-scene');
            const arSystem = sceneEl.systems["mindar-image-system"];
            arSystem.start(); 

            initMagicLogic();
        }

        function initMagicLogic() {
            const jokerTarget = document.getElementById('joker-target');
            const xTarget = document.getElementById('x-target');
            const stickmanPlane = document.getElementById('stickman-plane');
            const stickmanVideo = document.getElementById('stickman-video');

            jokerTarget.addEventListener("targetFound", () => { jokerFound = true; checkConditions(); });
            jokerTarget.addEventListener("targetLost", () => { jokerFound = false; checkConditions(); });
            xTarget.addEventListener("targetFound", () => { xCardFound = true; checkConditions(); });
            xTarget.addEventListener("targetLost", () => { xCardFound = false; checkConditions(); });

            function checkConditions() {
                if (jokerFound && xCardFound) {
                    if (!hasTriggeredVisual) {
                        hasTriggeredVisual = true;
                        
                        stickmanPlane.setAttribute('visible', 'true');
                        stickmanVideo.currentTime = 0;
                        stickmanVideo.play();

                        triggerFlash();

                        if (isVibrationAllowed && navigator.vibrate) {
                            androidVibrateInterval = setInterval(() => {
                                navigator.vibrate(200);
                            }, 500);
                        }
                    }
                } else {
                    if (!jokerFound || !xCardFound) {
                        stickmanPlane.setAttribute('visible', 'false');
                        stickmanVideo.pause();
                    }
                    if (!jokerFound && !xCardFound) {
                        hasTriggeredVisual = false;
                        if (androidVibrateInterval) {
                            clearInterval(androidVibrateInterval);
                            androidVibrateInterval = null;
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
